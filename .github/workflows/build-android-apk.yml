name: Build Android APK

on:
  pull_request:
    branches:
      - build-app
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SYSTEMCALL_API_BASE_URL: ${{ vars.SYSTEMCALL_API_BASE_URL }}

jobs:
  build-release-apk:
    name: Build release APK (ARM64)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release environment
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SYSTEMCALL_API_BASE_URL:-}" ]; then
            echo "::error::SYSTEMCALL_API_BASE_URL is not configured as a GitHub repository variable."
            exit 1
          fi

          case "$SYSTEMCALL_API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::SYSTEMCALL_API_BASE_URL must start with https://"
              exit 1
              ;;
          esac

          echo "Release API base URL is configured."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Write release environment
        shell: bash
        run: |
          printf 'SYSTEMCALL_API_BASE_URL=%s\n' "$SYSTEMCALL_API_BASE_URL" > .env

      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl --fail --location --retry 3 \
            --output android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/react-native-community/template/0.81.1/template/android/gradle/wrapper/gradle-wrapper.jar

      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build ARM64 release APK
        working-directory: android
        run: >
          java -classpath gradle/wrapper/gradle-wrapper.jar
          org.gradle.wrapper.GradleWrapperMain
          assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          --no-build-cache
          --parallel
          --no-daemon

      - name: Verify API URL was bundled
        shell: bash
        run: |
          set -euo pipefail

          bundle="android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle"

          if [ ! -f "$bundle" ]; then
            echo "::error::Release JavaScript bundle was not found at $bundle"
            exit 1
          fi

          if ! grep -Fq "$SYSTEMCALL_API_BASE_URL" "$bundle"; then
            echo "::error::SYSTEMCALL_API_BASE_URL was not embedded into the release JavaScript bundle."
            exit 1
          fi

          echo "Verified SYSTEMCALL_API_BASE_URL in release bundle."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemcall-mobile-arm64-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          apk_name="system-call-${RELEASE_TAG}-arm64-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk_name" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk_name" \
              --title "System Call ${RELEASE_TAG}" \
              --notes "Android release APK for ${RELEASE_TAG}." \
              --verify-tag
          fi
