name: Build Android APK

on:
  push:
    branches:
      - build-app
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build release APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl --fail --location --retry 3 \
            --output android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/react-native-community/template/0.81.1/template/android/gradle/wrapper/gradle-wrapper.jar

      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build ARM64 release APK
        working-directory: android
        run: >
          java -classpath gradle/wrapper/gradle-wrapper.jar
          org.gradle.wrapper.GradleWrapperMain
          assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          --build-cache
          --parallel
          --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemcall-mobile-arm64-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
