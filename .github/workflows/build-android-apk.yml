name: Build Android APK

on:
  push:
    branches:
      - build-app
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl --fail --location --retry 3 \
            --output android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/react-native-community/template/0.81.1/template/android/gradle/wrapper/gradle-wrapper.jar

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build debug APK
        working-directory: android
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemcall-mobile-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
